include=~/.config/foot/current-theme.ini

[main]
font=Maple Mono NF:size=20
term=xterm-256color
pad=14x14
workers=0
dpi-aware=yes

[colors-dark]
alpha=0.4

[url]
launch=xdg-open ${url}

[cursor]
style=block
blink=true

[mouse]
hide-when-typing=yes

[scrollback]
lines=10000

[key-bindings]
clipboard-copy=Control+Insert Control+Shift+c XF86Copy
primary-paste=none
clipboard-paste=Shift+Insert Control+Shift+v XF86Paste
